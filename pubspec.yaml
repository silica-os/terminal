name: terminal
description: Terminal, the terminal of Silica.
publish_to: none
version: 0.1.0

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  silica_ui:
    git:
      url: https://github.com/silica-os/silica-ui.git
      ref: v1.0.0-alpha.14
  xterm: ^4.0.0

flutter:
  generate: true
  fonts:
    - family: JetBrains Mono
      fonts:
        - asset: fonts/JetBrainsMonoNL-Regular.ttf
        - asset: fonts/JetBrainsMonoNL-Bold.ttf
          weight: 700
        - asset: fonts/JetBrainsMonoNL-Italic.ttf
          style: italic
        - asset: fonts/JetBrainsMonoNL-BoldItalic.ttf
          weight: 700
          style: italic

dev_dependencies:
  flutter_test:
    sdk: flutter
